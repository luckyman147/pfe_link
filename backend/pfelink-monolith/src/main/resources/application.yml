spring:
  application:
    name: pfelink-monolith

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/pfelink_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6380}
      timeout: 2000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration
    repair: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${EMAIL_USERNAME:}
    password: ${EMAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # Microsoft Entra External ID JWKS endpoint
          # Replace {tenant-id} with your actual Entra tenant ID
          jwk-set-uri: "${ENTRA_JWKS_URI:https://ciamlogin.com/7af38bd4-da09-4cad-b870-0617a2df54d4/discovery/v2.0/keys}"
          # Issuer URI for token validation
          issuer-uri: "${ENTRA_ISSUER_URI:https://ciamlogin.com/7af38bd4-da09-4cad-b870-0617a2df54d4/v2.0}"
          # Application (client) ID from Entra app registration
          audiences: "${ENTRA_CLIENT_ID:38d3cd96-2ead-4cb3-bec9-8be9aecb71d9"

server:
  port: 8081
  compression:
    enabled: true
    min-response-size: 1024
    mime-types:
      - application/json
      - text/html
      - text/xml

# Cloudinary Storage
cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME:dtjzttuo1}
  api_key: ${CLOUDINARY_API_KEY:api_key}
  api_secret: ${CLOUDINARY_API_SECRET:api_secret}

# App settings
app:
  # Public SPA URL (verification links, etc.). Match your VITE_APP_URL in production.
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  recaptcha:
    enabled: ${RECAPTCHA_ENABLED:false}
  admin:
    default-email: ${ADMIN_EMAIL:admin@test.com}
    default-password: ${ADMIN_PASSWORD:admin123}
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      - http://localhost:8080
      - http://localhost:8081

logging:
  level:
    root: INFO
    com.pfelink.monolith: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha

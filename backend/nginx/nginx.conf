events {
    worker_connections 1024;
}

http {
    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;

    server {
        listen 80;
        server_name localhost;

        # Redirect all HTTP to HTTPS (commented out for local dev, enable in prod)
        # return 301 https://$host$request_uri;

        location / {
            proxy_pass http://app:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Security Headers
            add_header X-Content-Type-Options nosniff;
            add_header X-Frame-Options DENY;
            add_header X-XSS-Protection "1; mode=block";
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; frame-src 'self' https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:;";

            # Apply Rate Limiting
            limit_req zone=one burst=20 nodelay;
        }

        # Stricter Rate Limiting for Auth
        location /api/auth/login {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://app:8081/api/auth/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/auth/signup {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://app:8081/api/auth/signup;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /actuator {
            proxy_pass http://app:8081/actuator;
        }

        # Nginx Status for Prometheus Exporter
        location /nginx_status {
            stub_status on;
            allow all;
        }
    }
}

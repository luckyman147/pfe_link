spring:
  application:
    name: pfelink-monolith

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/pfelink_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6380}
      timeout: 2000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:iyedtouato@gmail.com}
    password: ${EMAIL_PASSWORD:jwztvpfgxwpumobk}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8081

# Cloudinary Storage
cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME:dscdssfea}
  api_key: ${CLOUDINARY_API_KEY:741665864331788}
  api_secret: ${CLOUDINARY_API_SECRET:BYeLzu20xy9GMWoM6vpaAWy39J0}

# App settings
app:
  recaptcha:
    enabled: ${RECAPTCHA_ENABLED:false}
  admin:
    default-email: iyedtouato@gmail.com
    default-password: ${ADMIN_PASSWORD:iyedtouati}
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      - http://localhost:8080
      - http://localhost:8081

logging:
  level:
    root: INFO
    com.pfelink.monolith: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
